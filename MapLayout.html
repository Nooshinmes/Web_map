<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>VIU Web Map Application</title>
  <style>
    html, body, #viewDiv {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
    }
    #srDiv {
      background-image: url('banner.jpg');
      background-size: cover;
      color: white;
      font-size: 20px;
      font-weight: bold;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #srDiv img {
      height: 40px;
    }
  </style>

  <link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css">
  <script src="https://js.arcgis.com/4.32/"></script>

  <script>
    require([
      "esri/config",
      "esri/Map",
      "esri/views/MapView",
      "esri/geometry/Extent",
      "esri/layers/FeatureLayer",
      "esri/widgets/ScaleBar",
      "esri/widgets/Legend",
      "esri/widgets/LayerList",
      "esri/widgets/Home"
    ], function (esriConfig, Map, MapView, Extent, FeatureLayer, ScaleBar, Legend, LayerList, Home) {

      const map = new Map({
        basemap: "streets-vector"
      });

      const initialExtent = new Extent({
        xmin: -13800000,
        ymin: 6301000,
        xmax: -13799900,
        ymax: 6302350,
        spatialReference: 102100
      });

      const view = new MapView({
        container: "viewDiv",
        map: map,
        extent: initialExtent
      });

      var ViuLayer0 = new FeatureLayer({
        url: "https://catala.viu.ca/arcgis/rest/services/VIUMap_667566749/MapServer/0"
      });
      map.add(ViuLayer0);

      var ViuLayer1 = new FeatureLayer({
        url: "https://catala.viu.ca/arcgis/rest/services/VIUMap_667566749/MapServer/1"
      });
      map.add(ViuLayer1);

      var ViuLayer2 = new FeatureLayer({
        url: "https://catala.viu.ca/arcgis/rest/services/VIUMap_667566749/MapServer/2"
      });
      map.add(ViuLayer2);

      const scalebar = new ScaleBar({
        view: view,
        style: "ruler",
        unit: "metric"
      });
      view.ui.add(scalebar, "bottom-left");

      const legend = new Legend({
        view: view,
        style: "card"
      });
      view.ui.add(legend, "top-right");

      const layerList = new LayerList({
        view: view
      });
      view.ui.add(layerList, "bottom-right");

      const homeWidget = new Home({
        view: view
      });
      view.ui.add(homeWidget, "top-left");

      view.ui.add("srDiv", "manual");

    });
  </script>
</head>

<body>
  <div id="viewDiv"></div>
  <div id="srDiv" class="esri-widget">
    <img src="VIU-75-Logo.jpg" alt="VIU Logo">
    VIU Campus Web Map
  </div>
</body>
</html>
