<html> 
    <script language="Javascript">
        function toggle(targetId) {
          if (document.getElementById) {
            target = document.getElementById(targetId);
            if (target.style.display == "none") {
             target.style.display = "";
            } else {
             target.style.display = "none";
            }
          }
        }
        </script>
        
   <body>
      <iframe src="header.html" name="header" width="96%" height="60" scrolling="no"></iframe>
      <iframe  src="ToCMap.html" name="contents" width="15%"  height="600" scrolling="no"></iframe>
      <iframe src="Map.html" name="mapdisplay" width="80%" height="600" scrolling="yes"></iframe>
   </body>
</html>
